<!DOCTYPE html>
<html lang="en" class="bg-slate-950 text-slate-100">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Devin Auto-Remediation · Superset</title>
  <link rel="icon" type="image/png" href="/static/favicon.png" />

  <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'devin-teal': '#34d2c4',
            'devin-blue': '#4f9dff',
            'devin-amber': '#f5b942',
            'ink-950': '#050a17',
            'ink-900': '#0b1220',
            'ink-800': '#0f172a',
            'ink-700': '#182238',
            'ink-600': '#1f2c46',
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'monospace'],
            display: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
          boxShadow: {
            'soft': '0 1px 0 rgba(255,255,255,0.04) inset, 0 8px 24px rgba(0,0,0,0.25)',
            'glow-teal': '0 0 0 1px rgba(52,210,196,0.35), 0 10px 30px -10px rgba(52,210,196,0.30)',
          },
        },
      },
    }
  </script>

  <script src="https://unpkg.com/htmx.org@2.0.4"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: Inter, system-ui, sans-serif;
      background:
        radial-gradient(1100px 600px at 8% -10%, rgba(52, 210, 196, 0.14), transparent 60%),
        radial-gradient(900px 500px at 95% -5%, rgba(79, 157, 255, 0.14), transparent 60%),
        radial-gradient(800px 700px at 50% 110%, rgba(244, 113, 181, 0.06), transparent 65%),
        #050a17;
      min-height: 100vh;
    }
    /* Mask-based brand icons: SVG color follows currentColor */
    .ico {
      display: inline-block;
      background-color: currentColor;
      -webkit-mask-size: contain; mask-size: contain;
      -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
      -webkit-mask-position: center; mask-position: center;
    }
    .pulse-dot { position: relative; }
    .pulse-dot::after {
      content: ""; position: absolute; inset: -3px;
      border-radius: 999px; box-shadow: 0 0 0 0 currentColor;
      animation: pulse 1.6s ease-out infinite;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0   rgba(56,189,248,0.5); }
      70%  { box-shadow: 0 0 0 10px rgba(56,189,248,0); }
      100% { box-shadow: 0 0 0 0   rgba(56,189,248,0); }
    }
    .gradient-text {
      background: linear-gradient(95deg, #ffffff 0%, #b8e7ff 45%, #6ee7d3 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    /* HTMX swap fade */
    .htmx-swapping { opacity: 0.6; transition: opacity 0.15s ease; }
    .htmx-settling { opacity: 1; transition: opacity 0.15s ease; }
    /* Table dark theme tweaks */
    .table-dark thead th { background: rgba(15, 23, 42, 0.6); }
    .table-dark tbody tr:hover { background: rgba(120, 200, 220, 0.04); }
    /* Slim scrollbar */
    .scrollbar-thin::-webkit-scrollbar { width: 8px; height: 8px; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: rgba(120,200,220,0.20); border-radius: 4px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
  </style>
</head>
<body class="font-sans antialiased">
  {% block body %}{% endblock %}
</body>
</html>
